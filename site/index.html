<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amharic App</title>
<meta name="theme-color" content="#2f4f57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Amharic App">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Noto+Sans+Ethiopic:wght@400;600&family=Noto+Serif+Ethiopic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="head">
    <div class="brand">
      <h1><button class="brandbtn" data-act="mode" data-v="welcome" title="About this app" aria-label="Amharic App: about this app"><span>አማርኛ</span><em class="long">Amharic App</em></button></h1>
      <div class="tools">
        <button class="romtoggle" id="romtoggle" data-act="rom" aria-pressed="true" aria-label="Transcription" title="Show transcription"><i></i><span class="full">Transcription</span><span class="short">abc</span></button>
        <button class="ratebtn" id="ratebtn" data-act="rate" title="Audio speed: tap for slower">1×</button>
        <button class="findbtn" id="findbtn" data-act="mode" data-v="find" aria-pressed="false" aria-label="Search" title="Search every word"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
        <button class="whobtn" id="whobtn" data-act="mode" data-v="me" aria-pressed="false" title="Profiles and backup" aria-label="Profiles and backup"><span class="av">?</span><span class="nm">Profiles</span></button>
      </div>
    </div>
    <div class="seg" role="tablist">
      <button role="tab" id="tab-course" data-act="mode" data-v="course">Course</button>
      <button role="tab" id="tab-fidel" data-act="mode" data-v="fidel">Fidel</button>
      <button role="tab" id="tab-num" data-act="mode" data-v="num">Numbers</button>
      <button role="tab" id="tab-ref" data-act="mode" data-v="ref">Tables</button>
      <button role="tab" id="tab-test" data-act="mode" data-v="test">Test</button>
      <button role="tab" id="tab-prog" data-act="mode" data-v="prog">Progress</button>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<!-- Data first, then the verb engine, then the app. Plain scripts (not modules) so the page also works opened straight from disk. -->
<script src="audio/manifest.js"></script>
<script src="js/data/tables.js"></script>
<script src="js/data/course.js"></script>
<script src="js/data/verbs.js"></script>
<script src="js/data/vocab.js"></script>
<script src="js/data/fidel.js"></script>
<script src="js/data/sentences.js"></script>
<script src="js/data/builder.js"></script>
<script src="js/data/dialogues.js"></script>
<script src="js/engine.js"></script>
<script src="js/srs.js"></script>
<script src="js/builder.js"></script>
<script src="js/audio.js"></script>
<script src="js/profiles.js"></script>
<script src="js/listen.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/offline.js"></script>
<script src="js/progress.js"></script>
<script src="js/welcome.js"></script>
<script src="js/find.js"></script>
<script src="js/recorder.js"></script>
<script src="js/app.js"></script>
</body>
</html>
