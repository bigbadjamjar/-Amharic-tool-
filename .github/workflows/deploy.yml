name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the data and verb engine
        run: node tests/run.mjs

      # Clips added through the GitHub website are picked up here, so the manifest never has to be edited by hand.
      - name: Rebuild the audio list
        run: python3 tools/audio_manifest.py

      # The written course overview and the sitemap that Google reads, rebuilt from the course data.
      - name: Rebuild the pages for search engines
        run: node tools/make_learn_page.mjs

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
