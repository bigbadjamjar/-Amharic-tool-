name: Make audio clips

# Press "Run workflow" on the Actions tab. It makes a clip for every Amharic word and sentence
# that doesn't have one yet, saves them in site/audio/clips, and republishes the site.
# Both voices are used in every run, so there is no voice to pick:
#   the female voice (Mekdes) for words, sentences, letters and the women's dialogue lines,
#   the male voice (Ameha) for the men's dialogue lines (saved in site/audio/clips/m).
# Dialogue lines, reading stories and culture notes come with the course words.
# Clips it made before are remade if their text in the app has changed (e.g. punctuation fixed).
# Clips you added yourself are never replaced.
# "verb tables" makes every form in Tables › Verbs (each tense, each person) for all 342 verbs (course verbs first).
on:
  workflow_dispatch:
    inputs:
      which:
        description: Which words to make clips for
        type: choice
        default: course words and sentences
        options:
          - course words and sentences
          - fidel letters
          - verb tables
          - everything

permissions:
  contents: write
  actions: write

concurrency:
  group: make-audio
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the voice tool
        run: pip install edge-tts

      - name: Make missing clips
        run: |
          args=""
          [ "${{ inputs.which }}" = "course words and sentences" ] && args="$args --course-only"
          [ "${{ inputs.which }}" = "fidel letters" ] && args="$args --fidel"
          [ "${{ inputs.which }}" = "verb tables" ] && args="$args --verbs"
          python3 tools/make_audio.py $args

      # Runs even if the step above stopped part way, so finished clips are kept.
      - name: Save the clips
        if: always()
        run: |
          python3 tools/audio_manifest.py
          git add site/audio
          if git diff --cached --quiet; then echo "No new clips."; exit 0; fi
          n=$(git diff --cached --name-only --diff-filter=A -- site/audio/clips | wc -l)
          m=$(git diff --cached --name-only --diff-filter=M -- site/audio/clips | wc -l)
          git -c user.name="github-actions[bot]" -c user.email="41898099+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Audio: $n new clips, $m remade"
          git push
          echo "Saved $n new clips and remade $m whose text had changed." >> "$GITHUB_STEP_SUMMARY"

      # A push made by a workflow doesn't start other workflows, so start the deploy directly.
      - name: Republish the site
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
