name: Make audio clips

# Press "Run workflow" on the Actions tab. It makes a clip for every Amharic word and sentence
# that doesn't have one yet, saves them in site/audio/clips, and republishes the site.
# Both voices are used in every run, so there is no voice to pick:
#   the female voice (Mekdes) for words, sentences, letters and the women's dialogue lines,
#   the male voice (Ameha) for the men's dialogue lines (saved in site/audio/clips/m).
# Dialogue lines, reading stories and culture notes come with the course words.
# Clips it made before are remade if their text in the app has changed (e.g. punctuation fixed).
# Clips you added yourself are never replaced.
on:
  workflow_dispatch:
    inputs:
      which:
        description: Which words to make clips for
        type: choice
        default: course words and sentences
        options:
          - course words and sentences
          - fidel letters
          - everything

permissions:
  contents: write
  actions: write

concurrency:
  group: make-audio
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: TEMP check yourvoic cuts with MMS alignment model
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q soundfile
          python3 tools/tmp/fa.py || echo "FA STEP FAILED"
          git config user.name "github-actions[bot]"; git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add tools/tmp/yv/fa.json && git commit -qm "TEMP: MMS check of yourvoic cuts" && git push origin HEAD:${{ github.ref_name }} || true
